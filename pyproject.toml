[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agrisignal"
version = "1.0.0"
description = "Offline-First Smallholder Agricultural Decision Support & Agro-Climatic Advisory Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CodeSphere Innovationz", email = "codesphereinnovationz@gmail.com" }
]
keywords = [
    "agritech",
    "offline-first",
    "decision-support",
    "east-africa",
    "smallholder-farmers",
    "distributed-sync",
    "explainable-ai"
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
agrisignal = "agrisignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agrisignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["agrisignal"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["fastapi.*", "uvicorn.*", "pydantic.*"]
ignore_missing_imports = true

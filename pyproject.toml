[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agrisignal"
version = "1.0.0"
description = "Offline-First Smallholder Agricultural Decision Support & Agro-Climatic Advisory Platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "CodeSphere Innovationz", email = "codesphereinnovationz@gmail.com" }
]
keywords = [
    "agritech",
    "offline-first",
    "decision-support",
    "east-africa",
    "smallholder-farmers",
    "distributed-sync",
    "explainable-ai"
]
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
agrisignal = "agrisignal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
